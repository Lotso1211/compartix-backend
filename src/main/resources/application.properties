spring.application.name=compartix-backend

# Carga application-local.properties si existe (no se sube a git).
# Ahi van las credenciales reales de desarrollo local (ver application-local.properties.example).
spring.config.import=optional:application-local.properties

# ==========================================
# SERVIDOR
# ==========================================
server.port=8080
server.address=0.0.0.0

# ==========================================
# BASE DE DATOS - PostgreSQL
# En produccion define las variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
# Los valores tras ":" son solo para desarrollo local.
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/compartix_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# JWT
# Define JWT_SECRET (minimo 32 caracteres aleatorios). En local se toma de
# application-local.properties; en produccion define la variable de entorno.
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ==========================================
# CORS
# En produccion define CORS_ORIGINS con el dominio del frontend
# (varios origenes separados por coma).
# ==========================================
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}

# URL publica del backend (se usa para construir las URLs de las fotos subidas)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# URL del microservicio de IA (Python/Flask). En produccion define IA_SERVICE_URL.
ia.service.url=${IA_SERVICE_URL:http://localhost:5000}

# ==========================================
# SUBIDA DE ARCHIVOS (fotos de perfil, facturas)
# ==========================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# ==========================================
# LOGIN CON GOOGLE
# Crea un "OAuth 2.0 Client ID" (tipo Web) en https://console.cloud.google.com/apis/credentials
# con http://localhost:4200 como origen autorizado, y pega el Client ID aqui.
# Si se deja vacio, el backend acepta cualquier token de Google valido (solo para desarrollo).
# ==========================================
google.client-id=${GOOGLE_CLIENT_ID:223485023854-13utvm03mb4ilmck1tu28orca7qe6mjv.apps.googleusercontent.com}

# ==========================================
# CORREO (notificaciones por email y codigos de doble factor)
# Para Gmail: activa la verificacion en 2 pasos y crea una "App password" en
# https://myaccount.google.com/apppasswords, y define MAIL_ENABLED=true,
# MAIL_USERNAME y MAIL_PASSWORD como variables de entorno (nunca en este archivo).
# Puerto configurable porque algunos proveedores (p.ej. Render en su plan
# gratuito) bloquean el 587 (STARTTLS) pero permiten el 465 (SSL directo).
# Define MAIL_PORT=465 y MAIL_SSL=true si el 587 da timeout.
# ==========================================
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}